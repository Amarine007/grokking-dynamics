# CONTROL: identical to baseline.yaml except weight_decay = 0.
# Expected: memorises the training set but does not generalise within 40K steps.
data:
  p: 113
  train_frac: 0.3
  split_seed: 0

model:
  n_layers: 1
  n_heads: 4
  d_model: 128
  d_head: 32
  d_mlp: 512
  act_fn: relu

optim:
  name: adamw
  lr: 1.0e-3
  betas: [0.9, 0.98]
  weight_decay: 0.0

train:
  num_steps: 40000
  log_every: 100
  num_checkpoints: 20

runtime:
  device: cuda
  num_threads: 1
